{% extends 'base.html' %}
{% block title %}Thêm cuộc thi vào nhóm - {{ group.name }}{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    <h2>Thêm cuộc thi cho nhóm: {{ group.name }}</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="title" class="form-label">Tên cuộc thi</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>
        <div class="mb-3">
            <label for="slug" class="form-label">Slug (đường dẫn URL, ví dụ: vong-1-thcs)</label>
            <input type="text" class="form-control" id="slug" name="slug" required>
        </div>
        <div class="mb-3">
            <label for="start_time" class="form-label">Thời gian bắt đầu</label>
            <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
        </div>
        <div class="mb-3">
            <label for="end_time" class="form-label">Thời gian kết thúc</label>
            <input type="datetime-local" class="form-control" id="end_time" name="end_time" required>
        </div>

        <div class="mb-3">
            <label class="form-label"><strong>Chọn các bài tập có sẵn cho cuộc thi:</strong></label>
            <div class="border p-3 rounded" style="max-height: 250px; overflow-y: auto; background-color: #f8f9fa;">
                {% for problem in problems %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="problems" value="{{ problem.id }}" id="prob_{{ problem.id }}">
                        <label class="form-check-label" for="prob_{{ problem.id }}">
                            {{ problem.title }}
                        </label>
                    </div>
                {% empty %}
                    <p class="text-muted mb-0">Chưa có bài tập nào trong hệ thống.</p>
                {% endfor %}
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Tạo cuộc thi</button>
        <a href="{% url 'group_detail' group.slug %}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
{% endblock %}
