{% extends 'base.html' %}
{% block title %}Chỉnh sửa nhóm - {{ group.name }}{% endblock %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2>Chỉnh sửa nhóm</h2>
    <form method="post" class="mt-3">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Tên nhóm</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ group.name }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ group.description }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="{% url 'group_detail' group.slug %}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
{% endblock %}
