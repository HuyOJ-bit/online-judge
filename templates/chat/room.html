{% extends "base.html" %}
{% block title %}{{ room_title }}{% endblock %}
{% block content %}
<div class="spread">
  <h1>{{ room_title }}</h1>
  {% if back_url %}<a href="{{ back_url }}" class="muted">← back to contest</a>{% endif %}
</div>
<p class="muted">Talk with other contestants. Be kind — admins can see everything. 🙂</p>

<div class="chat-box" data-room="{{ room }}">
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-error" id="chat-error"></div>
  <form class="chat-form" id="chat-form" autocomplete="off">
    <input type="text" id="chat-input" maxlength="500" placeholder="Type a message and press Enter…">
    <button class="btn" type="submit">Send</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
{% load static %}
<script src="{% static 'js/chat.js' %}"></script>
{% endblock %}
