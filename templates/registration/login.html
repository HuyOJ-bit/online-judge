{% extends "base.html" %}
{% load static %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}<h1>Đăng nhập</h1>
<div class="card form-narrow">
  {% if form.errors %}
    <div class="flash flash-error">Sai tên người dùng hoặc mật khẩu - cả hai đều phân biệt chữ hoa thông thường.</div>{% endif %}<form method="post">
    {% csrf_token %}
    <label for="id_username">User name</label>
<input autofocus="" id="id_username" name="username" required="" type="text"/>
<label for="id_password">Mật khẩu</label>
<input id="id_password" name="password" required="" type="password"/>
<input name="next" type="hidden" value="{{ next }}"/>
<p style="margin-top:16px;"><button class="btn" type="submit">Đăng nhập</button></p>
</form>
<p class="muted">Mới ở đây à? <a href="{% url 'register' %}">Tạo một tài khoản</a>.</p>
</div>
{% endblock %}
